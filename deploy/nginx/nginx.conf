# deploy/nginx/nginx.conf

server {
    listen 80;
    server_name localhost;
    
    # Przekierowanie 301 z HTTP na HTTPS (Wymaganie W3)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Rekomendowane ustawienia SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://prestashop:80;
        
        # Nagłówki niezbędne, by PrestaShop "wiedział", że jest za proxy HTTPS
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header HTTPS on;
        
        # Wsparcie dla długich zapytań i timeoutów przy instalacji
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
