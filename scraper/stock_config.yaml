# Konfiguracja losowania stanów magazynowych metodą odwracania dystrybuanty (W3)
# Prawdopodobieństwo, że cały produkt będzie wyprzedany (stan 0 na wszystkich wariantach; wymóg W3: 0.05 - 0.20)
out_of_stock_prob: 0.12

# Prawdopodobieństwo, że pojedynczy wariant (rozmiar) dostępnego produktu ma stan 0
variant_out_of_stock_prob: 0.10

# Maksymalny łączny stan magazynowy produktu (suma wszystkich wariantów; wymóg W3: <= 10 szt.)
max_product_stock: 10

# Wagi prawdopodobieństwa dla poszczególnych stanów dostępnych (1 - 10 szt.).
# Wartości są automatycznie normalizowane do sumy 1.0 przy budowie dystrybuanty (CDF).
in_stock_weights:
  1: 0.18
  2: 0.16
  3: 0.14
  4: 0.12
  5: 0.10
  6: 0.09
  7: 0.07
  8: 0.06
  9: 0.04
  10: 0.04
